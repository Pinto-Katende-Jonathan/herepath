# mkdocs.yml -- configuration for the herepath documentation site.
#
# Build it locally with:
#     pip install -e ".[docs]"
#     mkdocs serve
# then open http://127.0.0.1:8000
#
# The site is bilingual (English + French) thanks to the mkdocs-static-i18n
# plugin. English pages live in docs/en/, French pages in docs/fr/. The two
# folders mirror each other page-for-page.

site_name: herepath
site_description: A simpler way to find your files -- a Python port of the R 'here' package.
site_author: Jonathan Katende Pinto
site_url: https://pinto-katende-jonathan.github.io/herepath/

repo_name: Pinto-Katende-Jonathan/herepath
repo_url: https://github.com/Pinto-Katende-Jonathan/herepath
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  features:
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search
  - i18n:
      docs_structure: folder
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: fr
          name: Français
          build: true
          nav_translations:
            Home: Accueil
            Installation: Installation
            Tutorial: Tutoriel
            "Advanced guide": "Guide avancé"
            "Command line": "Ligne de commande"
            "API reference": "Référence de l'API"
            Contributing: Contribuer

nav:
  - Home: index.md
  - Installation: installation.md
  - Tutorial: tutorial.md
  - Advanced guide: advanced.md
  - Command line: command-line.md
  - API reference: api-reference.md
  - Contributing: contributing.md
